<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEC AI Trading 360 Pro</title>
<style>
body{
 margin:0;background:#08101f;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
header{
 background:#111c33;padding:20px;
 border-bottom:1px solid #263858
}
.logo{font-size:22px;font-weight:800;color:#69a7ff}
.small{font-size:13px;color:#91a6c7;margin-top:5px}
main{padding:14px;max-width:900px;margin:auto}
.card{
 background:#121d33;border:1px solid #293b5d;
 border-radius:16px;padding:18px;margin-bottom:14px
}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.price{font-size:38px;font-weight:800;margin:8px 0}
.green{color:#35d39a}
.red{color:#ff6b81}
.yellow{color:#ffc857}
button{
 background:#2463eb;color:white;border:0;
 border-radius:9px;padding:10px 14px;font-weight:600
}
.grid{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;margin-top:12px
}
.box{
 background:#0a1427;border-radius:10px;
 padding:12px;color:#9fb1ce
}
.box b{display:block;color:white;margin-top:5px}
#signal{font-size:34px;font-weight:900}
</style>
</head>

<body>

<header>
<div class="logo">◈ ZEC AI Trading 360 Pro</div>
<div class="small">实时行情 · 技术分析 · 模拟交易</div>
</header>

<main>

<div class="card">
<div class="row">
<div>
<div class="small">ZEC / USDT</div>
<div id="price" class="price">连接中...</div>
<div id="time" class="small">正在获取实时行情</div>
</div>

<div>
<div id="status" class="yellow">● CONNECTING</div>
</div>
</div>

<button onclick="load()">↻ 刷新行情</button>
</div>

<div class="card">

<div class="small">AI TECHNICAL SIGNAL</div>
<div id="signal" class="yellow">WAIT</div>
<div id="reason" class="small">等待市场数据...</div>

<div class="grid">

<div class="box">
EMA 20
<b id="ema20">—</b>
</div>

<div class="box">
EMA 50
<b id="ema50">—</b>
</div>

<div class="box">
RSI 14
<b id="rsi">—</b>
</div>

<div class="box">
趋势
<b id="trend">—</b>
</div>

</div>
</div>

<div class="card">

<b>自动交易计划</b>

<div class="grid">

<div class="box">
参考入场
<b id="entry">—</b>
</div>

<div class="box">
止损 SL
<b id="sl">—</b>
</div>

<div class="box">
TP1
<b id="tp1">—</b>
</div>

<div class="box">
TP2
<b id="tp2">—</b>
</div>

</div>

<p class="small">
仅用于市场分析及模拟交易，不执行真实资金交易。
</p>

</div>

</main>

<script>

const API=
"https://data-api.binance.vision/api/v3/klines?symbol=ZECUSDT&interval=15m&limit=100";

function EMA(data,n){
 let k=2/(n+1);
 let e=data[0];

 for(let i=1;i<data.length;i++)
  e=data[i]*k+e*(1-k);

 return e;
}

function RSI(data,n=14){

 let gain=0,loss=0;

 for(let i=data.length-n;i<data.length;i++){

  let d=data[i]-data[i-1];

  if(d>0) gain+=d;
  else loss-=d;

 }

 if(loss===0) return 100;

 let rs=(gain/n)/(loss/n);

 return 100-(100/(1+rs));
}

async function load(){

 let status=document.getElementById("status");

 status.innerText="● CONNECTING";
 status.className="yellow";

 try{

  let res=await fetch(API,{cache:"no-store"});

  if(!res.ok) throw new Error();

  let raw=await res.json();

  let close=raw.map(x=>Number(x[4]));

  let price=close[close.length-1];

  let e20=EMA(close.slice(-60),20);
  let e50=EMA(close.slice(-80),50);
  let rsi=RSI(close);

  document.getElementById("price").innerText=
  "$"+price.toFixed(2);

  document.getElementById("ema20").innerText=
  e20.toFixed(2);

  document.getElementById("ema50").innerText=
  e50.toFixed(2);

  document.getElementById("rsi").innerText=
  rsi.toFixed(1);

  let signal="WAIT";
  let reason="趋势暂未形成一致信号。";
  let trend="NEUTRAL";

  if(e20>e50){

   trend="BULLISH";

   if(rsi>50 && rsi<70){
    signal="BUY";
    reason="EMA20 高于 EMA50，同时 RSI 保持多头动能。";
   }

  }

  if(e20<e50){

   trend="BEARISH";

   if(rsi<50 && rsi>30){
    signal="SELL";
    reason="EMA20 低于 EMA50，同时 RSI 保持空头动能。";
   }

  }

  let s=document.getElementById("signal");

  s.innerText=signal;

  s.className=
  signal==="BUY"?"green":
  signal==="SELL"?"red":"yellow";

  document.getElementById("trend").innerText=trend;
  document.getElementById("reason").innerText=reason;

  let risk=price*0.01;

  let dir=signal==="SELL"?-1:1;

  document.getElementById("entry").innerText=
  price.toFixed(2);

  document.getElementById("sl").innerText=
  (price-dir*risk).toFixed(2);

  document.getElementById("tp1").innerText=
  (price+dir*risk).toFixed(2);

  document.getElementById("tp2").innerText=
  (price+dir*risk*2).toFixed(2);

  document.getElementById("time").innerText=
  "更新时间："+new Date().toLocaleString(
   "zh-CN",{timeZone:"Asia/Kuala_Lumpur"}
  )+" MYT";

  status.innerText="● LIVE";
  status.className="green";

 }catch(e){

  status.innerText="● OFFLINE";
  status.className="red";

  document.getElementById("price").innerText=
  "行情连接失败";

 }

}

load();

setInterval(load,30000);

</script>

</body>
</html>
